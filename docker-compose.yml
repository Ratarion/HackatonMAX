services:
  # ============================================
  # PostgreSQL 16 — база данных
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: layndaru-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-layndaru_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      TZ: ${TZ:-Asia/Novokuznetsk}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d layndaru_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # MAX-бот (Python 3.12, aiomax)
  # ============================================
  maxbot:
    build: ./maxbot
    container_name: layndaru-maxbot
    restart: unless-stopped
    volumes:
      - ./maxbot:/app
    environment:
      - TZ=${TZ:-Asia/Novokuznetsk}
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASS:-postgres}@postgres:5432/${DB_NAME:-layndaru_db}
      - MAX_TOKEN=${MAX_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
